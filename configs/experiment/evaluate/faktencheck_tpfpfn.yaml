# @package _global_

# Collect true-positive, false-positive, and false-negative entries for a single field.
#
# This experiment is intended for qualitative error analysis. It keeps the matching and missed
# entries instead of reducing them to aggregate scores.

defaults:
 - override /metric: tpfpfn_single_field

metric:
  field: ???
  # For compound entries, selected nested keys can be ignored before comparing prediction and
  # reference items.
  ignore_subfields:
    ecosystem_type: ["description"]
    taxa: ["collective_term"]
    conservation_area: ["description"]
    direct_driver: ["details"]
    indirect_driver: ["details"]
    # Note: we do not ignore `description` of `management_measure`/`impulse_measure`
    #  since it holds its main content (and is mandatory)

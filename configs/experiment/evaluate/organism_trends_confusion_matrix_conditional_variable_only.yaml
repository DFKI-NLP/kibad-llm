# @package _global_

# Confusion matrices for organism trend predictions conditioned on matched base entries,
# grouping by `Hauptgruppe_RoteListen` and `Lebensraum` and scoring only `Antwortvariable`
# for groups that are present in both prediction and reference.

defaults:
 - override /dataset: organism_trends_forest
 - override /metric: confusion_matrix_multiple_fields

metric:
  fields:
   - organism_trends
  subfield_keys:
    organism_trends:
     - Hauptgruppe_RoteListen
     - Lebensraum
  subfield_values:
    organism_trends:
     - Antwortvariable
  ignore_missing_entries: true

  sort_fields: true

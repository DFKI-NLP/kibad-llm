# @package _global_

# F1 score metric for ecosystem-service/biodiversity trend predictions, scoring each
# `ecosystem_service_trends` compound as one entry, restricted to four fields: `ÖSL` (the variable
# being checked), `Biodiv_Facette`, `Einfluss` (the indicator variable) and
# `Lebensraum_Gruppiert`. As `Lebensraum_Gruppiert` is single-valued, a paper that covers several
# habitats yields one entry (tuple) per habitat, in predictions as well as in the references. `Themenkomplex`, `ESGroup` and `Arten` are still extracted but ignored during
# evaluation for now.

defaults:
 - override /dataset: ecosystem_service
 - override /metric: f1_micro

metric:
  # the fields in the prediction and reference to compute the F1 score on
  fields:
   - ecosystem_service_trends
  # for compound entries, we may ignore certain subfields during evaluation
  ignore_subfields:
    ecosystem_service_trends:
     - Themenkomplex
     - ESGroup
     - Arten

  format_as_markdown: true
  sort_fields: true

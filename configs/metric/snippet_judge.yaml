# LLM judge that compares the evidence snippets of the EvidenceSnippetExtractor (configs/extractor/evidence_snippets.yaml)
# with the gold entries (labels plus annotator text). For each gold entry, the judge rates every candidate snippet
# of the same document as match / partial / no_match and says whether the reported result agrees with the gold
# entry. See src/kibad_llm/metrics/snippet_judge.py for the reported scores.
#
# The judge uses the same kind of local model as the extractor (see configs/extractor/llm/). Choose it with e.g.
# `extractor/llm@metric.llm=gpt_oss_120b` (requires a running backend, see models/README.md).

defaults:
  - /extractor/llm@llm: gpt_oss_20b
  - /extractor/request_parameters@request_parameters: default
  # judge prompt (German), see configs/metric/prompt_template/
  - prompt_template@prompt_template: snippet_judge
  - _self_

_target_: kibad_llm.metrics.SnippetJudgeMetric

# field of the reference that holds the list of gold entries, e.g. ecosystem_service_trends
reference_field: ???
# gold fields shown to the judge as labels (null: all fields that are not in text_fields)
label_fields: null
# gold fields shown to the judge as annotator text, e.g. notes or descriptions of the source location
text_fields: []
# task-specific explanation, inserted at {task_description} in the prompt
task_description: ""
# also judge findings whose anchors could not be located in the text (the judge then only sees the quotes)
include_unlocated: false
# candidates per judge call; more candidates are split into several calls
max_candidates_per_call: 10
# write per-entry judgements (with rationales) to this JSON file, e.g. ${hydra:runtime.output_dir}/snippet_judgements.json
details_file: null

use_guided_decoding: true
return_reasoning: false

schema:
  _target_: kibad_llm.schema.evidence_snippets.SnippetJudgeOutput.model_json_schema
  by_alias: false

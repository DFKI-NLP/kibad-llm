# extraction workflow that repeats the extraction for each item in the overrides list
# and aggregates the results per key unanimously (i.e., only if all extractions agree
# on the same value, otherwise an error is raised)

defaults:
  # both aggregators come from the shared `aggregator` config group; the `@<package>`
  # suffix decides which kwarg of the extractor they end up in.
  - aggregator@aggregator: unanimous
  - aggregator@chunking_aggregator: single_majority_vote_multi_union
  - llm: gpt_oss_20b
  - prompt_template: default
  - request_parameters: default
  - _with_evidence

_target_: kibad_llm.extractors.MultiPassExtractorWithChunking

# Overrides need to be a list (or dictionary) containing dictionaries that will get
# instantiated and then passed as kwargs to the respective base extractor. Thus,
# no hydra-like merging for individual kwargs is possible.
#
# Example: split the core fields schema (see https://github.com/DFKI-NLP/kibad-llm/issues/158)
# into four sub-schemas and extract each one in its own pass. Pair it with
# `extractor/prompt_template=faktencheck_core_v1_with_chunking`:
#
#   overrides:
#     habitat:
#       schema:
#         _target_: kibad_llm.schema.types.EcosystemStudyFeaturesHabitat.model_json_schema
#         by_alias: false
#     taxa:
#       schema:
#         _target_: kibad_llm.schema.types.EcosystemStudyFeaturesTaxa.model_json_schema
#         by_alias: false
#     biodiversity_level:
#       schema:
#         _target_: kibad_llm.schema.types.EcosystemStudyFeaturesBiodiversityLevel.model_json_schema
#         by_alias: false
#     ecosystem_type:
#       schema:
#         _target_: kibad_llm.schema.types.EcosystemStudyFeaturesEcosystemType.model_json_schema
#         by_alias: false
#
# The same can be passed on the command line as a dict literal. Mind the single quotes:
# they keep the shell from applying brace expansion to it.
#
#   uv run -m kibad_llm.predict pdf_directory=path/to/pdf/files \
#     extractor=multi_pass \
#     extractor/prompt_template=faktencheck_core_v1_with_chunking \
#     'extractor.overrides={habitat:{schema:{_target_:kibad_llm.schema.types.EcosystemStudyFeaturesHabitat.model_json_schema,by_alias:false}},taxa:{...}}'
overrides: ???

# these values are based on ChatGPT suggestions as gathered by Leo in pr #282:
# - Since PDFs can be huge, chunking is mandatory.
# - Chunk size depends on model max context:
#   - 12B–14B models: 2K–4K tokens per chunk
#   - 20B–27B models: 4K–8K tokens per chunk (some models allow 16K–128K with long context tuning)
# - Overlap chunks slightly (e.g., 100–200 tokens) to maintain context across pages.
#
# values are calculated with regards to gpt_oss_20b, using the heuristic of 5 characters per token
max_char_buffer: 20000

# the tokenizer ensures that any chunk produced is split at sane points.
# whilst this tokenizer won't match the llms tokenizer, it ensures "more sensible" chunks.
# for more details on how the tokenizer works, please refer to the docstring of ChunkIterator.
tokenizer:
  _target_: kibad_llm.extractors.chunking_utils.RegexTokenizer

# for these fields, return a list of results from each extraction
return_as_list:
  # - structured
  - structured_with_metadata
  - errors
  # - response_content
  - reasoning_content
  # - messages
  # - messages_formatted
  - character_start
  - character_end

# general return options (see simple extractor for details)
return_reasoning: True
return_messages: False
return_messages_formatted: False

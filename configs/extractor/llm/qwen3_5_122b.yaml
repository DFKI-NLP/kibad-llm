# Example configuration for using Qwen/Qwen3.5-122B-A10B model with LlamaIndex
#
# This requires a local deployment of the model compatible with the OpenAI API.
# See models/README.md for instructions.
#
# To use as an argument for `predict`, use `extractor/llm=qwen3_5_122b`.
# Run VLLM with:
#   ./run_with_llm.sh -v "Qwen/Qwen3.5-122B-A10B \
#     --tensor-parallel-size 8 \
#     --max-model-len 131072 \
#     --reasoning-parser qwen3 \
#     --language-model-only"
# --language-model-only skips the vision encoder to free memory (text-only PDF use case)
# See https://huggingface.co/Qwen/Qwen3.5-122B-A10B for VLLM options

_target_: kibad_llm.llms.OpenAILikeVllm

# get the API base URL from the environment variable LLM_API_BASE, defaulting to http://127.0.0.1:5001/v1
api_base: ${oc.env:LLM_API_BASE,http://127.0.0.1:5001/v1}
api_key: "dummy"
model: "Qwen/Qwen3.5-122B-A10B"
# Recommended: temperature=1.0 / top_p=0.95 for thinking mode per HF model card.
temperature: 1.0

# enable to correctly handle (i.e. remove) reasoning traces in the output
is_chat_model: true
# Native context length is 262,144 tokens; use lower value to save memory and improve performance.
# HF recommends minimum 128K to preserve thinking capabilities.
# See https://github.com/DFKI-NLP/kibad-llm/issues/440 for test results.
context_window: 131072
timeout: 360
max_retries: 3

# Specify additional parameters to the request body.
additional_kwargs:
  # the default is None, so we set it to 8192, to allow enough space for reasoning and output tokens
  max_completion_tokens: 8192
  seed: ${seed}
  top_p: 0.95
  top_k: 20
  presence_penalty: 1.5  # recommended by HF model card for thinking mode

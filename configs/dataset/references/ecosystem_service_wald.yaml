_target_: kibad_llm.dataset.csv.read_grouped_csv_records
output_key: ecosystem_service_trends
# unlike ÖSL-VoteCount-Vollständig.csv, this file has a "Key" column with Zotero item keys matched
# in, compatible with how predictions are keyed (see configs/dataset/predictions/extraction_result.yaml)
# forest dev set: papers that contain the habitat Wald, without reviews / pure model studies. Created from
# data/external/ecosystem_services/ösl_papers_raw.csv with
#   uv run -m kibad_llm.data_integration.align_ecosystem_service_csv \
#       --exclude-methods Literaturstudie Modell/Simulation --require-habitat Wald
file: "${paths.root_dir}/data/interim/ecosystem_services/ösl_papers_processed_wald.csv"
pdf_id_column: "Key"
# column names match `EcosystemServiceFields` field names (see src/kibad_llm/schema/types.py) so
# that no post-processing/renaming is needed, analogous to `OrganismBiodiversityTrend`.
columns:
  - Einfluss
  - Themenkomplex
  - ÖSL
  # pre-normalized/grouped, classifiable version of "ÖSL" (fewer distinct values)
  - ESGroup
  - Biodiv_Facette
  # pre-normalized/grouped version of "Lebensraum" (fewer distinct values, closer to HabitatEnum)
  - Lebensraum_Gruppiert
  - Arten
# `Lebensraum_Gruppiert` is scalar in `EcosystemServiceFields` (one habitat per relationship), but
# 17 rows in the source CSV name multiple, comma-separated habitats for one relationship (e.g.
# "Wald, Agrar- und Offenland") - split those into one row per habitat so entries stay comparable
# to predictions.
split_columns:
  Lebensraum_Gruppiert: ", "

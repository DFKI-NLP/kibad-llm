_target_: kibad_llm.dataset.csv.read_grouped_csv_records
output_key: ecosystem_service_trends
# ösl_papers_raw.csv has a "Key" column with Zotero item keys matched in, compatible with how
# predictions are keyed (see configs/dataset/predictions/extraction_result.yaml) forest dev set:
# papers that contain the habitat Wald, without reviews / pure model studies.
# Created from data/external/ecosystem_services/ösl_papers_raw.csv with
#   uv run -m kibad_llm.data_integration.align_ecosystem_service_csv \
#       --exclude-methods Literaturstudie Modell/Simulation --require-habitat Wald  # codespell:ignore
file: "${paths.root_dir}/data/interim/ecosystem_services/ösl_papers_processed_wald.csv"
pdf_id_column: "Key"
# column names match `EcosystemServiceFieldsHabitat` field names (see src/kibad_llm/schema/types.py) so
# that no post-processing/renaming is needed, analogous to `OrganismBiodiversityTrend`.
columns:
  - Themenkomplex
  - ÖSL
  - Biodiv_Facette
  - Einfluss
  - Arten
# Further columns of the CSV are not read, as they are not part of the schema: "ESGroup"
# (grouped version of "ÖSL"), the CICES columns, and "Lebensraum_Gruppiert" (the file is already restricted to
# papers that contain the habitat "Wald", see above).

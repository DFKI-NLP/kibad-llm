# TODO (not yet functional): the raw CSV column headers ("Einfluss", "ÖSL", "Biodiv-Facette",
# "Art(en)", ...) don't match the `EcosystemServiceFields` field names used in predictions
# ("influence", "ecosystem_service", "biodiversity_facet", "taxa", ...), since predictions are
# generated with by_alias: false. Columns will need to be renamed to the field names for evaluation
# to line up.
# TODO: "Lebensraum_Gruppiert" values use "Küste und Küstengewässer", while `HabitatEnum` uses
# "Küsten und Küstengewässer" (plural) - this mismatch needs to be resolved before habitat values
# line up between predictions and references.
_target_: kibad_llm.dataset.csv.read_grouped_csv_records
output_key: ecosystem_service_trends
# unlike ÖSL-VoteCount-Vollständig.csv, this file has a "Key" column with Zotero item keys matched
# in, compatible with how predictions are keyed (see configs/dataset/predictions/extraction_result.yaml)
file: "${paths.root_dir}/data/external/ecosystem_services/ösl_papers_ids.csv"
pdf_id_column: "Key"
columns:
  - Einfluss
  - Themenkomplex
  - ÖSL
  - Biodiv-Facette
  # pre-normalized/grouped version of "Lebensraum" (fewer distinct values, closer to HabitatEnum)
  - Lebensraum_Gruppiert
  - Art(en)

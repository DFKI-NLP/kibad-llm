name: 454_faktencheck_core
prediction_logs: logs/397_faktencheck_core_v1_for_chunking/predict
paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: ${paths.root_dir}/data
  timestamp: ${now:%Y-%m-%d_%H-%M-%S}
  run_subdir: ${paths.timestamp}
  output_dir: ${hydra:runtime.output_dir}
  save_dir: ${paths.root_dir}
  log_dir: ${paths.save_dir}/logs/${name}/evaluate
  work_dir: ${hydra:runtime.cwd}
  prediction_save_dir: ${paths.save_dir}/predictions/${name}/${paths.timestamp}
dataset:
  predictions:
    _target_: kibad_llm.dataset.prediction.load_with_metadata
    log: logs/397_faktencheck_core_v1_for_chunking/predict/multiruns/2026-04-02_16-54-02/0
    file: null
    id_key: file_name
    process_id:
      _partial_: true
      _target_: kibad_llm.utils.path.strip_filename_extension
    preprocess:
      _target_: kibad_llm.utils.dictionary.get
      _partial_: true
      key: structured
  references:
    _target_: kibad_llm.dataset.json.read_and_preprocess
    file: ${paths.root_dir}/data/interim/faktencheck-db/faktencheck-db-converted_2025-11-05.jsonl
    id_key: zotitem_ptr_id
  _target_: kibad_llm.dataset.utils.merge_references_into_predictions
metric:
  _target_: kibad_llm.metrics.TpFpFnCollector
  field: biodiversity_level
  per_record: true
  ignore_subfields:
    ecosystem_type:
    - description
    taxa:
    - collective_term
    conservation_area:
    - description
    direct_driver:
    - details
    indirect_driver:
    - details
